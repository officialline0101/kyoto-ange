<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>予約フォーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --base: #fffdfb;
            --silk-1: #ffffff;
            --silk-2: #f6efeb;
            --pink: #e6789b;
            --pink-deep: #d45b82;
            --pink-mid: #ec8aac;
            --pink-soft: #fbe6ee;
            --pink-pale: #fdf4f8;
            --pink-border: rgba(214, 100, 140, 0.32);
            --pink-border-soft: rgba(214, 100, 140, 0.16);
            --gold: #c39a52;
            --gold-soft: #e2cd92;
            --gold-line: rgba(195, 154, 82, 0.55);
            --ink: #6d5f64;
            --ink-soft: #a3949a;
            --shadow: rgba(180, 120, 140, 0.16);
            --available: #e6789b;
            --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
            --sans: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
            --script: 'Parisienne', cursive;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--sans);
            color: var(--ink);
            background-color: #fdf8f6;
            background-image:
                radial-gradient(110% 60% at 82% -5%, rgba(251, 230, 238, 0.55) 0%, rgba(251,230,238,0) 52%),
                repeating-linear-gradient(118deg, rgba(255,255,255,0) 0 42px, rgba(255,255,255,0.4) 42px 45px),
                linear-gradient(140deg, #ffffff 0%, #f7f0ec 42%, #ffffff 72%, #f5ece8 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px 56px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }

        .container {
            position: relative;
            background-color: #ffffff;
            border: 1px solid var(--gold-line);
            border-radius: 16px;
            box-shadow: 0 18px 48px -24px var(--shadow), 0 2px 8px rgba(120, 90, 100, 0.04);
            width: 100%;
            max-width: 480px;
            padding: 0 22px 30px;
            overflow: hidden;
        }

        /* ===== Header ===== */
        h1 {
            position: relative;
            margin: 0 -22px 28px;
            padding: 40px 28px 30px;
            text-align: center;
            font-family: var(--serif);
            font-weight: 500;
            font-size: 23px;
            line-height: 1.75;
            letter-spacing: 0.1em;
            color: var(--pink-deep);
            background:
                radial-gradient(90% 120% at 50% -20%, rgba(251, 230, 238, 0.6) 0%, rgba(251,230,238,0) 55%),
                linear-gradient(160deg, #ffffff 0%, #fdf5f1 100%);
            overflow: hidden;
        }
        h1::before {
            /* gold inset frame */
            content: "";
            position: absolute;
            inset: 13px;
            border: 1.4px solid var(--gold-line);
            border-radius: 3px;
            pointer-events: none;
        }
        .header-script {
            display: block;
            font-family: var(--script);
            font-weight: 400;
            font-size: 48px;
            line-height: 1;
            letter-spacing: 0.01em;
            color: var(--pink);
            margin-bottom: 4px;
        }
        .header-script::after {
            content: "";
            display: block;
            width: 64px;
            height: 1px;
            margin: 10px auto 12px;
            background: linear-gradient(90deg, rgba(195,154,82,0) 0%, var(--gold) 50%, rgba(195,154,82,0) 100%);
        }
        .header-sub {
            display: block;
            font-family: var(--sans);
            font-size: 10.5px;
            letter-spacing: 0.22em;
            color: var(--gold);
            font-weight: 500;
            margin-top: 16px;
            text-indent: 0.22em;
        }

        /* ===== Section labels ===== */
        .label {
            display: block;
            margin: 26px 0 12px;
            padding: 9px 14px 9px 16px;
            font-family: var(--serif);
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.04em;
            color: var(--pink-deep);
            background: linear-gradient(90deg, var(--pink-soft) 0%, var(--pink-pale) 100%);
            border-left: 3px solid var(--pink);
            border-bottom: 1px solid var(--gold-soft);
            border-radius: 0 8px 8px 0;
            text-align: left;
            text-indent: 0;
        }

        /* ===== Text inputs ===== */
        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 14px 15px;
            margin: 0 0 4px;
            border: 1px solid var(--pink-border);
            border-radius: 10px;
            background-color: #fffdfc;
            box-sizing: border-box;
            font-family: var(--sans);
            font-size: 16px;
            color: var(--ink);
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
            top: 0;
        }
        textarea { resize: vertical; line-height: 1.7; }
        input::placeholder, textarea::placeholder { color: #c4b4ba; }

        input:focus,
        textarea:focus {
            border-color: var(--pink);
            outline: none;
            background-color: #fffafc;
            box-shadow: 0 0 0 3px rgba(230, 120, 155, 0.12), 0 0 14px rgba(195, 154, 82, 0.18);
        }

        /* ===== Generic buttons reset ===== */
        button {
            font-family: var(--sans);
            padding: 14px;
            border: 1px solid var(--pink-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: var(--ink);
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }
        button:hover {
            background-color: var(--pink-pale);
            transform: none;
        }

        /* ===== Choice button rows ===== */
        .visit-buttons,
        .menu-sections,
        .irradiations {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .visit-buttons button,
        .menu-sections button,
        .irradiations button {
            flex: 1;
            min-width: 120px;
            padding: 14px 12px;
            border: 1px solid var(--pink-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: var(--ink);
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            font-size: 16px;
        }
        .visit-buttons button:hover,
        .menu-sections button:hover,
        .irradiations button:hover {
            background-color: var(--pink-pale);
            border-color: var(--pink);
        }

        /* Selected state (active) — rose pink w/ gold ring */
        .visit-buttons button.active,
        .menu-sections button.active,
        .irradiations button.active,
        .symptoms button.active,
        .options button.active {
            background: linear-gradient(165deg, var(--pink-mid) 0%, var(--pink) 60%, var(--pink-deep) 100%);
            color: #fffafc;
            border-color: var(--pink-deep);
            box-shadow: 0 0 0 1.5px var(--gold), 0 6px 16px -8px var(--shadow);
            outline: none;
            outline-offset: 0;
        }

        /* ===== Menu list (vertical) ===== */
        .symptoms,
        .options {
            display: block;
            margin-bottom: 8px;
        }
        .symptoms button,
        .options button {
            display: block;
            width: 100%;
            padding: 15px 16px;
            margin-bottom: 10px;
            border: 1px solid var(--pink-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: var(--ink);
            cursor: pointer;
            text-align: center;
            white-space: normal;
            font-size: 16px;
            line-height: 1.5;
        }
        .symptoms button:hover,
        .options button:hover {
            background-color: var(--pink-pale);
            border-color: var(--pink);
        }

        /* note under a label */
        .info-text {
            position: static;
            top: 0;
            margin: -4px 0 12px;
            padding: 10px 14px;
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-soft);
            text-align: center;
            background-color: var(--pink-pale);
            border: 1px solid var(--gold-soft);
            border-radius: 8px;
            word-wrap: break-word;
        }

        /* menu detail / price box */
        #treatment-text {
            display: none; /* メニューが選択されるまで非表示。選択時にJSで表示 */
            background-color: #fffdfb;
            padding: 16px 18px;
            border: 1px solid var(--pink-border-soft);
            border-left: 3px solid var(--gold-soft);
            border-radius: 8px;
            margin: 0 0 16px;
            box-shadow: none;
            font-family: var(--sans);
            font-size: 14.5px;
            line-height: 1.8;
            color: var(--ink);
        }
        #treatment-text strong { color: var(--pink-deep); }

        /* ===== Calendar ===== */
        .calendar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            width: 100%;
        }
        .week-button-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin: 8px 0 16px;
        }
        .week-button {
            padding: 9px 14px;
            background-color: #ffffff;
            color: var(--pink-deep);
            border: 1px solid var(--pink-border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.3;
            transition: background-color 0.22s ease, border-color 0.22s ease;
            transform-origin: center center;
        }
        .week-button:hover {
            background-color: var(--pink-soft);
            border-color: var(--pink);
            transform: none;
        }
        .week-button:active { transform: scale(0.97); }

        .current-month {
            text-align: center;
            display: inline-block;
            background: linear-gradient(165deg, var(--pink-mid) 0%, var(--pink) 100%);
            color: #fffafc;
            padding: 5px 16px;
            border-radius: 999px;
            font-family: var(--serif);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 12px -6px var(--shadow);
            position: static;
            left: auto;
            transform: none;
        }

        .calendar {
            flex: 1;
            background-color: #ffffff;
            border: 1px solid var(--pink-border);
            border-radius: 10px;
            box-shadow: 0 8px 22px -16px var(--shadow);
            overflow: hidden;
            width: 100%;
        }
        .calendar table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .calendar th,
        .calendar td {
            font-size: 12.5px;
            text-align: center;
            padding: 6px 2px;
            cursor: pointer;
            vertical-align: middle;
            box-sizing: border-box;
            border: 1px solid var(--pink-border-soft);
            color: var(--ink);
        }
        .calendar th:first-child,
        .calendar td:first-child {
            width: 16%;
            font-size: 11.5px;
            color: var(--ink-soft);
            background-color: var(--pink-pale);
            cursor: default;
        }
        .calendar th {
            background-color: var(--pink-soft);
            color: var(--pink-deep);
            font-family: var(--sans);
            font-weight: 500;
            padding: 8px 2px;
            line-height: 1.3;
            cursor: default;
        }
        .calendar td:hover {
            background-color: var(--pink-pale);
        }
        .calendar td.selected,
        .calendar td.selected.available {
            background: linear-gradient(165deg, var(--pink-mid) 0%, var(--pink) 60%, var(--pink-deep) 100%);
            color: #fffafc !important;
            box-shadow: inset 0 0 0 1.5px var(--gold);
        }

        /* availability marks */
        .available { color: var(--available); font-weight: 600; }
        .unavailable {
            color: #c9bdc1;
            background-color: #faf6f4;
            cursor: default;
        }
        .unavailablegray {
            background-color: #f1eae7;
            color: #c2b6ba;
            cursor: default;
        }
        .calendar td.unavailable:hover,
        .calendar td.unavailablegray:hover { background-color: #f1eae7; }

        .available.blue::before { content: '◯'; color: var(--available); font-size: 16px; }
        .available.red::before  { content: '◯'; color: var(--available); font-size: 16px; }
        .centered-text { text-align: center; }
        .circle { display: inline-block; width: 1em; height: 1em; text-align: center; line-height: 1em; font-size: 1em; vertical-align: middle; }
        .blue { color: var(--available); }
        .red { color: var(--ink); }

        /* ===== Loading spinner ===== */
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            text-align: center;
            background-color: rgba(212, 91, 130, 0.82);
            padding: 36px 40px;
            border-radius: 14px;
            box-shadow: 0 16px 40px -16px rgba(120, 70, 90, 0.5);
            z-index: 50;
        }
        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255, 255, 255, 0.28);
            border-top-color: var(--gold-soft);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        .loading-text {
            margin-top: 18px;
            font-family: var(--serif);
            font-size: 14px;
            color: #fffafc;
            letter-spacing: 0.14em;
            text-align: center;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Reservation confirmation ===== */
        #displayInfo {
            background-color: #fffdfb;
            border: 1px solid var(--pink-border-soft);
            border-radius: 12px;
            padding: 6px 18px 14px;
            font-size: 15px;
            line-height: 1.7;
            color: var(--ink);
        }
        #displayInfo p { margin: 12px 0; }
        #displayInfo hr {
            border: none;
            border-top: 1px solid var(--gold-soft);
            opacity: 0.6;
            margin: 0;
        }
        /* soften the inline red labels into rose pink */
        #displayInfo span[style*="color:red"],
        #displayInfo span[style*="color: red"] {
            color: var(--pink-deep) !important;
        }
        #displayInfo strong { letter-spacing: 0.02em; }

        .highlight-background {
            background-color: var(--pink-soft);
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0 15px;
            text-align: center;
        }
        .highlight-text { display: block; font-weight: 700; text-align: center; color: var(--pink-deep); }
        .red-circle { color: var(--available); }
        .bold-cross { font-weight: 700; color: var(--ink-soft); }

        /* ===== Submit CTA (pink pill w/ gold rim) ===== */
        .submit-button {
            width: 100%;
            padding: 18px;
            border: 2px solid var(--gold);
            border-radius: 999px;
            background: linear-gradient(180deg, var(--pink-mid) 0%, var(--pink) 55%, var(--pink-deep) 100%);
            color: #fffafc;
            font-family: var(--serif);
            font-size: 19px;
            letter-spacing: 0.18em;
            cursor: pointer;
            margin-top: 26px;
            box-shadow: 0 14px 30px -14px rgba(214, 91, 130, 0.55);
            transition: filter 0.22s ease, box-shadow 0.22s ease;
        }
        .submit-button:hover {
            background: linear-gradient(180deg, var(--pink-mid) 0%, var(--pink) 55%, var(--pink-deep) 100%);
            filter: brightness(1.05);
            box-shadow: 0 18px 36px -14px rgba(214, 91, 130, 0.6);
            transform: none;
        }
        .submit-button:active { transform: translateY(1px); }

        .menu-section { display: none; }
        .menu-section.active { display: block; }
        #repairLabel, #repairButtons { display: none; }

        /* ===== Mobile ===== */
        @media (max-width: 768px) {
            body { padding: 0 0 48px; align-items: stretch; }
            .container {
                width: 100%;
                max-width: none;
                margin: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
                padding: 0 16px 28px;
            }
            h1 { margin: 0 -16px 26px; font-size: 21px; padding: 36px 22px 28px; }
            .header-script { font-size: 44px; }
            .calendar-container { width: 100%; }
            .calendar { width: 100%; }
            .calendar th, .calendar td { font-size: 12px; padding: 6px 1px; }
            .calendar th:first-child, .calendar td:first-child { font-size: 11px; }
            .info-text { font-size: 12.5px; line-height: 1.7; }
            input, textarea, button { font-size: 16px; }
            .week-button { font-size: 12.5px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1><span class="header-script">Reserve</span>れい先生 スピリチュアル<br>予約フォーム<span class="header-sub">安珠 あんじゅ ｜ 占い・スピリチュアルカウンセリング</span></h1>

        <div class="label">お客様名※必須</div>
        <input type="text" id="name" placeholder="お名前を入力してください">

        <div class="label">電話番号※必須</div>
        <input type="tel" id="phone" placeholder="電話番号を入力してください">

        <div class="label">鑑定方法をお選びください※必須</div>
        <div class="visit-buttons">
            <button type="button" id="inPerson" onclick="selectConsultation(this)">対面鑑定</button>
            <button type="button" id="phoneConsult" onclick="selectConsultation(this)">電話鑑定</button>
        </div>

        <div class="label" id="callTypeLabel" style="display:none;">通話方法をお選びください※必須</div>
        <div class="visit-buttons" id="callTypeButtons" style="display:none;">
            <button type="button" id="lineCall" onclick="selectCallType(this)">LINE通話</button>
            <button type="button" id="normalCall" onclick="selectCallType(this)">通常電話</button>
        </div>

        <div class="label">ご来店回数※必須</div>
        <div class="visit-buttons">
            <button type="button" id="firstVisit" onclick="selectVisit(this)">1回目</button>
            <button type="button" id="repeatVisit" onclick="selectVisit(this)">2回目以降</button>
        </div>

        <div class="label">メニューをお選びください</div>
        <div class="info-text">※メニューを選択すると空き状況のカレンダーが表示されます</div>
        <div id="treatment-text" style="margin-bottom: 20px;"></div>
        <div class="symptoms">
        </div>

        <div class="label">希望日時</div>
        <div class="centered-text">
        </div>
        <div class="calendar-container">
            <div class="week-button-container">
                <button class="week-button" onclick="previousWeek()">前の週<br>←</button>
                <span class="current-month" id="currentMonth">月</span>
                <button class="week-button" onclick="nextWeek()">次の週<br>→</button>
            </div>
            <div id="calendar1" class="calendar">
                <table>
                    <thead>
                        <tr id="calendar-header">
                            <th>時間</th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- カレンダーの内容がここに追加される -->
                    </tbody>
                </table>
            </div>
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <div class="loading-text">読み込み中...</div>
            </div>
        </div>

        <div class="label">お悩みの症状をお書きください</div>
        <textarea id="message" rows="4" placeholder="メッセージを入力してください"></textarea>

        <div class="label">ご予約内容</div>
        <div id="displayInfo"></div> <!-- ここに選択された情報を表示します -->

        <button class="submit-button" onclick="submitForm()">予約を行う</button>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script>
        let visitCount = '';
        let consultationType = ''; // 鑑定方法（対面鑑定／電話鑑定）
        let callType = '';         // 通話方法（LINE通話／通常電話）電話鑑定のみ
        let selectedSymptom = [];  // 配列として定義
        let selectedReplyText = ''; // LINEに送信するメニューの応答テキスト
        let selectedFullDate = '';
        let currentDate = new Date();
        let availabilityCache = {};
        let irradiationsCount = ''; <!-- 選択された症状を格納する変数 -->
        let totalAmount = 0; // 合計金額を格納する変数
        let menuPrice = 0; // メニューの価格
        let optionsPrice = 0; // オプションの合計価格

        // 霊視鑑定メニューの定義（対面鑑定・電話鑑定 共通。20分は2回目以降のみ）
        const menuData = {
            '20分': {
                name: '霊視鑑定🔮20分', price: 6000, time: 20, repeatOnly: true,
                detail: '※2回目以降のお客様のみご利用頂けます。'
            },
            '40分': {
                name: '霊視鑑定🔮40分', price: 12000, time: 40,
                detail: '初めての方や、恋愛運・仕事運の両方の鑑定にオススメ♪<br>※初めての方は、40分鑑定よりお願い致します。'
            },
            '60分': {
                name: '霊視鑑定🔮60分', price: 18000, time: 60,
                detail: '2つ以上ご質問があり、ゆっくりお話ししたい方にオススメ♫'
            },
            '90分': {
                name: '霊視鑑定🔮90分', price: 27000, time: 90,
                detail: '定期的に当店に来られない方や<br>ご自身で経営されている方など<br>1度で多くの鑑定結果を求められる方におすすめ！'
            },
            '120分': {
                name: '霊視鑑定🔮120分', price: 36000, time: 120,
                detail: '通常の鑑定よりも深い内容の鑑定を求められる方や<br>より複雑な内容を相談したい方におすすめ！'
            }
        };

        document.addEventListener('DOMContentLoaded', function () {
            liff.init({
                liffId: '2006596831-KDkYv20m'
            }).then(() => {
                console.log('LIFF初期化成功');
            }).catch((err) => {
                console.log('LIFF初期化失敗', err);
            });

            fetchAvailability(currentDate);
        });

        // 訪問回数ごとの時間設定 (例：初めて=20分、2回目以降=15分)

        async function fetchAvailability(date) {
            const startTime = new Date(date);
            const endTime = new Date(date);
            endTime.setDate(endTime.getDate() + 7);

            const cacheKey = startTime.toISOString() + endTime.toISOString();

            // キャッシュを確認
            if (availabilityCache[cacheKey]) {
                console.log('Using cached data');
                updateCalendar(availabilityCache[cacheKey].availability, availabilityCache[cacheKey].businessDays);
                return;
            }

            const url = 'https://script.google.com/macros/s/AKfycbxNvClJ88Wuy3tSHkFpT6LICdOHoDOeT1H67f4qFeOm7AzYP34dFHQsA8P5lIdC9qMy9A/exec' +
                `?startTime=${startTime.toISOString()}&endTime=${endTime.toISOString()}`;

            try {
                showLoadingSpinner(); // Show loading spinner
                const response = await fetch(url);
                const data = await response.json();
                console.log(data);

                // 営業日の情報を抽出
                const businessDays = data.filter(event => event.summary === "営業日").map(event => {
                    return {
                        start: new Date(event.startTime),
                        end: new Date(event.endTime)
                    };
                });

                // データをキャッシュに保存
                availabilityCache[cacheKey] = { availability: data, businessDays: businessDays };

                updateCalendar(data, businessDays);
            } catch (error) {
                console.error('Error fetching availability:', error);
            } finally {
                hideLoadingSpinner(); // Hide loading spinner
            }
        }

        function updateCalendar(availability, businessDays) {
            const calendar = document.getElementById('calendar1');
            const table = calendar.querySelector('table tbody');

            const times = [
                '11:00', '11:30',
                '12:00', '12:30', '13:00', '13:30',
                '14:00', '14:30', '15:00', '15:30',
                '16:00', '16:30', '17:00', '17:30',
                '18:00', '18:30', '19:00'
            ];

            if (table.rows.length === 0) {
                for (const time of times) {
                    const row = document.createElement('tr');
                    const timeCell = document.createElement('td');
                    timeCell.textContent = time;
                    row.appendChild(timeCell);

                    for (let i = 0; i < 7; i++) {
                        const cell = document.createElement('td');

                        // unavailable と unavailablegray クラスがある場合は選択不可
                        cell.addEventListener('click', () => {
                            if (cell.classList.contains('unavailable') || cell.classList.contains('unavailablegray')) {
                                return; // 何もしない
                            }
                            selectDate(cell);
                        });

                        row.appendChild(cell);
                    }

                    table.appendChild(row);
                }
            }

            // テーブルのヘッダーを更新
            updateCalendarHeader(currentDate);

            // 各セルを空白にリセットし、クラスもリセット
            for (let row of table.rows) {
                for (let i = 1; i < row.cells.length; i++) {
                    row.cells[i].textContent = '';
                    row.cells[i].removeAttribute('data-date');
                    row.cells[i].classList.remove('available', 'unavailable', 'selected', 'unavailablegray');
                }
            }

            // 現在の日時を取得
            const now = new Date();

            // テーブルの内容を更新
            for (let i = 0; i < 7; i++) {
                const day = new Date(currentDate);
                day.setDate(day.getDate() + i);

                let businessEventTimes = []; // 営業日のイベント時間帯を記録する配列

                availability.forEach(slot => {
                    const eventStart = new Date(slot.startTime);
                    const eventEnd = new Date(slot.endTime);
                    if (eventStart.toDateString() === day.toDateString() && slot.title === "営業日") {
                        businessEventTimes.push({ start: eventStart, end: eventEnd });
                    }
                });

                for (let j = 0; j < times.length; j++) {
                    const cell = table.rows[j].cells[i + 1];

                    // すでにセルが✕の場合はスキップする
                    if (cell.textContent === '✕') {
                        continue;
                    }

                    const slotStart = new Date(day);
                    slotStart.setHours(parseInt(times[j].split(':')[0]), parseInt(times[j].split(':')[1]), 0, 0);

                    const slotEnd = new Date(slotStart);
                    let menuDuration = selectedMenuTime || 10;
                    let visitDuration = selectedVisitTime || 0;
                    let irradiationsDuration = selectedirradiationsTime || 0;

                    // 実際の鑑定時間（分）
                    let totalDuration = menuDuration + visitDuration + irradiationsDuration;

                    // 予約と予約の間に余白を確保するため、実時間の「次の30分区切り」まで枠を確保する
                    // 例：40分→60分、60分→90分（ちょうど30分単位のメニューも+30分の余白）
                    let bufferedDuration = (Math.floor(totalDuration / 30) + 1) * 30;

                    // 余白込みの所要時間で終了時間を設定（この空きが無ければ予約不可）
                    slotEnd.setMinutes(slotStart.getMinutes() + bufferedDuration);

                    // 18時以降に終了する予約を不可にする (17:30は可)
                    if (slotEnd.getHours() === 19 && slotEnd.getMinutes() > 0) {
                        cell.textContent = '✕';
                        cell.classList.add('unavailable');
                        continue;
                    } else if (slotEnd.getHours() > 18) {
                        cell.textContent = '✕';
                        cell.classList.add('unavailable');
                        continue;
                    }

                    // ここで終了時間を使った条件処理を行う
                    // 例えば、リアルタイムで既に過ぎた時間帯は×にする
                    if (slotStart < now) {
                        cell.textContent = '✕';
                        cell.classList.add('unavailable');
                        continue;
                    }

                    const isBusinessDay = businessDays.some(businessDay => {
                        const businessDayStart = new Date(businessDay.start);
                        const businessDayEnd = new Date(businessDay.end);
                        return slotStart >= businessDayStart && slotEnd <= businessDayEnd;
                    });

                    const isBusinessEventTime = businessEventTimes.some(event => {
                        return slotStart < event.end && event.start < slotEnd;
                    });

                    const count = availability.reduce((acc, slot) => {
                        const eventStart = new Date(slot.startTime);
                        const eventEnd = new Date(slot.endTime);

                        if (eventStart < slotEnd && slotStart < eventEnd && slot.title !== "営業日") {
                            return acc + 1;
                        }
                        return acc;
                    }, 0);

                    // 営業日のイベント時間内に他のイベントがある場合
                    if (isBusinessEventTime && count > 0) {
                        cell.textContent = '✕';
                        cell.classList.add('unavailable');
                    }
                    // 営業日のイベント時間（他のイベントがない場合）
                    else if (isBusinessEventTime) {
                        cell.textContent = '◯';
                        cell.classList.add('available');
                    }
                    // 営業日で、指定されている時間以外の時間は×
                    else if (businessEventTimes.length > 0) {
                        cell.textContent = '✕';
                        cell.classList.add('unavailable');
                    }
                    // 営業日でかつ他のイベントがない場合
                    else if (isBusinessDay && count === 0) {
                        cell.textContent = '◯';
                        cell.classList.add('available');
                    }
                    // それ以外の条件
                    else if (count === 0) {
                        cell.textContent = '◯';
                        cell.classList.add('available');
                    } else {
                        cell.textContent = '✕';
                        cell.classList.add('unavailable');
                    }

                    cell.setAttribute('data-date', slotStart.toISOString());
                }
            }
        }

        function updateCalendarHeader(date) {
            const headerRow = document.getElementById('calendar-header');
            const headers = headerRow.querySelectorAll('th:not(:first-child)');

            const startDate = new Date(date);

            headers.forEach((th, index) => {
                const day = new Date(startDate);
                day.setDate(day.getDate() + index);

                const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'];
                const dayString = `${day.getDate()}(${dayOfWeek[day.getDay()]})`;
                th.innerHTML = dayString.replace('(', '<br>(');
            });

            // 現在の月を表示
            const currentMonthElement = document.getElementById('currentMonth');
            currentMonthElement.textContent = `${startDate.getFullYear()}年 ${startDate.getMonth() + 1}月`;
        }

        function nextWeek() {
            currentDate.setDate(currentDate.getDate() + 7);
            fetchAvailability(currentDate);
        }

        function previousWeek() {
            currentDate.setDate(currentDate.getDate() - 7);
            fetchAvailability(currentDate);
        }

        function showLoadingSpinner() {
            document.getElementById('loadingSpinner').style.display = 'block';
        }

        function hideLoadingSpinner() {
            document.getElementById('loadingSpinner').style.display = 'none';
        }
    </script>
</body>

</html>
